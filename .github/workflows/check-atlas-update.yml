name: Check for MITRE ATLAS updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-atlas:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for and stage a compatible ATLAS release
        run: node scripts/check-atlas-update.mjs --apply

      - name: Validate generated data
        run: npm run build:data

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Detect update changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard data/upstream/atlas data/generated atlas-update-summary.md)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/atlas-update
          delete-branch: true
          commit-message: "chore(data): update pinned MITRE ATLAS release"
          title: "Update pinned MITRE ATLAS release"
          body-path: atlas-update-summary.md
          labels: data, research-review
          add-paths: |
            data/upstream/atlas/*.yaml
            data/editorial/project.json
            data/generated/field-guide.json
